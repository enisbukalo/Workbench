# quillfolio.toml — quill's data-driven phase engine config.
#
# This is the DEFAULT written by `quill --init`. It reproduces quill's classic
# 0-6 workflow: branch -> plan -> review plan -> implement -> review impl
# (2-model fan-out + finalizer) -> build/test -> delivery intent -> mechanical commit/PR.
#
# Everything here is data: edit it (or the server's shared persona library)
# and the change is picked up on the next run. Adding, removing, reordering, or
# renaming an LLM phase is config + .md only — no driver code change.

[repo]
# omit `name` -> derived from `git remote get-url origin` (cwd is the repo).
# name          = "owner/repo"
# project_board = "Workbench"   # omit -> skip the board step
pr_base       = "main"

[runner]
# Model-server backend behind the pre-spawn seam.
#   "llamacpp" (default) -- swap presets per phase on the llama.cpp router.
#   "vllm"               -- use the service-owned vLLM model registry.
# vllm requires machine-level QUILL_VLLM_URL. Launch vllm with VLLM_SERVER_DEV_MODE=1
# so POST /reset_prefix_cache is mounted. Never commit machine addresses here.
backend    = "vllm"

# The service-owned model registry controls launch commands and model-to-service mappings.
# Repository config may only select an approved model ID on each phase.

[build]
# Local gates run tests first, then build the Linux and Windows release executables. Quill captures
# stdout/stderr into build-findings.md and sends it to the implementation retry on either failure.
command = "./build.sh --all"
test    = "./build.sh --test"
log_dir = "logs"

[retries]            # revise-then-verify attempts. 0 = no retry (a BLOCK halts).
default = 3          # default revise rounds for gated phases without an explicit retry_budget
spawn   = 1          # re-spawns on CRASH / GARBAGE -- any phase

# ---------------------------------------------------------------------------
# Phases form a declared graph. Array order controls presentation and the initial phase only;
# every phase owns its outcome routes through `transitions`.
#
#   producer   - LLM writes an artifact (plan, impl).            persona + model
#   reviewer   - LLM judges and writes findings. `[[workflows.ticket.phase.audits]]` runs named, same-model audit
#                lanes concurrently on vLLM; `models=[...]` remains sequential model fan-out.
#                `against=[producer ids]` names the artifacts it reviews against.
#   finalizer  - LLM reconciles N reviewers' findings + gates.   reconciles=[...]
#   mechanical - deterministic verification, delivery, CI, or publication step.
#
# The server prepares the branch mechanically. Agents author typed delivery text only; mechanical
# delivery validates and owns staging, the commit, the exact non-forced push, and PR creation.
# `transitions` maps outcomes to a phase, `@complete`, or `@fail`; routes may move in any direction.
# `retry_budget` limits BLOCK-route traversals and `EXHAUSTED` defines what happens afterward.
# ---------------------------------------------------------------------------

[workflows]
default = "ticket"

[workflows.ticket]
label = "New ticket"
mode = "create"

[[workflows.ticket.phase]]
id       = "plan"
transitions = { DONE = "review_plan", PASS = "review_plan" }
type     = "producer"
label    = "write plan"
persona  = "plan.md"
model    = "Qwen3.6_35B_A3B_NVFP4"
skills   = ["workbench"]
artifact = "plan.md"
max_artifact_chars = 16000
self_check = "self-check-plan.md"
produces_contract = "quill.plan/v1"
accepts_contracts = ["quill.review.findings/v1"]

[[workflows.ticket.phase]]
id           = "review_plan"
transitions = { DONE = "impl_core", PASS = "impl_core", BLOCK = "plan", EXHAUSTED = "@fail" }
type         = "reviewer"
label        = "review plan"
persona      = "review-plan.md"
models       = ["Qwen3.6_27B_NVFP4"]
skills       = ["workbench"]
against      = ["plan"]
gates        = true
structured_findings = true
retry_budget = 1
max_artifact_chars = 12000
self_check = "self-check-findings.md"
produces_contract = "quill.review.findings/v1"
accepts_contracts = ["quill.plan/v1"]

[[workflows.ticket.phase]]
id                = "impl_core"
transitions = { DONE = "impl_integration", PASS = "impl_integration" }
type              = "producer"
label             = "core"
persona           = "impl-core.md"
model             = "Qwen3.6_35B_A3B_NVFP4"
skills            = ["workbench"]
artifact          = "impl-core.md"
inputs            = ["plan"]
max_artifact_chars = 8000
self_check = true
produces_contract = "quill.implementation/v1"
accepts_contracts = ["quill.plan/v1"]

[[workflows.ticket.phase]]
id                = "impl_integration"
transitions = { DONE = "impl_finalize", PASS = "impl_finalize" }
type              = "producer"
label             = "integration"
persona           = "impl-integration.md"
model             = "Qwen3.6_35B_A3B_NVFP4"
skills            = ["workbench"]
artifact          = "impl-integration.md"
inputs            = ["plan", "impl_core"]
max_artifact_chars = 8000
self_check = true
produces_contract = "quill.implementation/v1"
accepts_contracts = ["quill.plan/v1", "quill.implementation/v1"]

[[workflows.ticket.phase]]
id                = "impl_finalize"
transitions = { DONE = "review_impl", PASS = "review_impl" }
type              = "producer"
label             = "finalize"
persona           = "impl-finalize.md"
model             = "Qwen3.6_35B_A3B_NVFP4"
skills            = ["workbench"]
artifact          = "impl.md"
inputs            = ["plan", "impl_core", "impl_integration"]
max_artifact_chars = 10000
self_check = true
produces_contract = "quill.implementation/v1"
accepts_contracts = ["quill.plan/v1", "quill.implementation/v1", "quill.review.findings/v1", "quill.verification/v1", "quill.ci/v1"]

[[workflows.ticket.phase]]
id      = "review_impl"
transitions = { DONE = "review_impl_final", PASS = "review_impl_final" }
type    = "reviewer"
label   = "implementation audits"
against = ["plan", "impl_core", "impl_integration", "impl_finalize"]
structured_findings = true
max_artifact_chars = 12000
self_check = "self-check-findings.md"
produces_contract = "quill.review.findings/v1"
accepts_contracts = ["quill.plan/v1", "quill.implementation/v1"]

[[workflows.ticket.phase.audits]]
id      = "architecture"
label   = "requirements + architecture"
persona = "review-impl-architecture.md"
model   = "Qwen3.6_27B_NVFP4"
skills  = ["workbench"]

[[workflows.ticket.phase.audits]]
id      = "correctness"
label   = "correctness + lifecycle"
persona = "review-impl-correctness.md"
model   = "Qwen3.6_27B_NVFP4"
skills  = ["workbench"]

[[workflows.ticket.phase.audits]]
id      = "tests"
label   = "tests + regressions"
persona = "review-impl-tests.md"
model   = "Qwen3.6_27B_NVFP4"
skills  = ["workbench"]

[[workflows.ticket.phase]]
id           = "review_impl_final"
transitions = { DONE = "test", PASS = "test", BLOCK = "impl_finalize", EXHAUSTED = "@fail" }
type         = "finalizer"
label        = "implementation gate"
persona      = "review-final.md"
model        = "Qwen3.6_27B_NVFP4"
skills		 = ["workbench"]
reconciles   = ["review_impl"]
gates        = true
structured_findings = true
retry_budget = 1
max_artifact_chars = 12000
self_check = "self-check-findings.md"
produces_contract = "quill.review.findings/v1"
accepts_contracts = ["quill.review.findings/v1"]

[[workflows.ticket.phase]]
id           = "test"
transitions = { DONE = "build", PASS = "build", BLOCK = "impl_finalize", EXHAUSTED = "@fail" }
type         = "mechanical"
label        = "run tests locally"
step         = "test"
gates        = true
retry_budget = 4
requires     = ["impl_finalize"]
produces_contract = "quill.verification/v1"
accepts_contracts = ["quill.implementation/v1"]

[[workflows.ticket.phase]]
id           = "build"
transitions = { DONE = "delivery_intent", PASS = "delivery_intent", BLOCK = "impl_finalize", EXHAUSTED = "@fail" }
type         = "mechanical"
label        = "build Linux and Windows executables"
step         = "build"
gates        = true
retry_budget = 4
requires     = ["impl_finalize"]
produces_contract = "quill.verification/v1"
accepts_contracts = ["quill.implementation/v1"]

[[workflows.ticket.phase]]
id       = "delivery_intent"
transitions = { DONE = "delivery", PASS = "delivery" }
type     = "producer"
label    = "prepare delivery text"
persona  = "delivery-intent.md"
model    = "Qwen3.6_35B_A3B_NVFP4"
skills   = []
artifact = "delivery-intent.md"
inputs   = ["plan", "impl_finalize"]
max_artifact_chars = 8000
requires = ["review_impl_final", "test", "build"]
produces_contract = "quill.delivery-intent/v1"
accepts_contracts = ["quill.plan/v1", "quill.implementation/v1", "quill.review.findings/v1", "quill.verification/v1"]

[[workflows.ticket.phase]]
id = "delivery"
transitions = { DONE = "ci", PASS = "ci" }
type = "mechanical"
label = "commit + push + PR"
step = "deliver_create"
requires = ["delivery_intent"]
produces_contract = "quill.delivery/v2"
accepts_contracts = ["quill.delivery-intent/v1"]

[[workflows.ticket.phase]]
id           = "ci"
transitions = { DONE = "@complete", PASS = "@complete", BLOCK = "impl_finalize", EXHAUSTED = "@fail" }
type         = "mechanical"
label        = "wait for PR tests"
step         = "ci_check"
gates        = true
retry_budget = 2
requires     = ["delivery"]
produces_contract = "quill.ci/v1"
accepts_contracts = ["quill.delivery/v2"]

[workflows.pr_update]
label = "Update existing PR"
mode = "update"
feedback_after_head = true
resolve_review_threads = true

[[workflows.pr_update.phase]]
id = "update_scope"
transitions = { DONE = "update_impl", PASS = "update_impl" }
type = "producer"
label = "scope update"
persona = "update-scope.md"
model = "Qwen3.6_35B_A3B_NVFP4"
skills = ["workbench"]
artifact = "update-scope.md"
self_check = true
max_artifact_chars = 8000
produces_contract = "quill.update.scope/v1"

[[workflows.pr_update.phase]]
id = "update_impl"
transitions = { DONE = "test", PASS = "test" }
type = "producer"
label = "implement update"
persona = "update-impl.md"
model = "Qwen3.6_35B_A3B_NVFP4"
skills = ["workbench"]
artifact = "update-impl.md"
inputs = ["update_scope"]
self_check = true
max_artifact_chars = 8000
produces_contract = "quill.update.implementation/v1"
accepts_contracts = ["quill.update.scope/v1", "quill.verification/v1", "quill.review.findings/v1", "quill.ci/v1"]

[[workflows.pr_update.phase]]
id = "test"
transitions = { DONE = "build", PASS = "build", BLOCK = "update_impl", EXHAUSTED = "@fail" }
type = "mechanical"
label = "run tests locally"
step = "test"
gates = true
retry_budget = 4
requires = ["update_impl"]
produces_contract = "quill.verification/v1"
accepts_contracts = ["quill.update.implementation/v1"]

[[workflows.pr_update.phase]]
id = "build"
transitions = { DONE = "review_update", PASS = "review_update", BLOCK = "update_impl", EXHAUSTED = "@fail" }
type = "mechanical"
label = "build Linux and Windows executables"
step = "build"
gates = true
retry_budget = 4
requires = ["update_impl"]
produces_contract = "quill.verification/v1"
accepts_contracts = ["quill.update.implementation/v1"]

[[workflows.pr_update.phase]]
id = "review_update"
transitions = { DONE = "head_guard", PASS = "head_guard", BLOCK = "update_impl", EXHAUSTED = "@fail" }
type = "reviewer"
label = "review update"
persona = "review-update.md"
models = ["Qwen3.6_27B_NVFP4"]
skills = ["workbench"]
against = ["update_scope", "update_impl"]
gates = true
structured_findings = true
retry_budget = 1
max_artifact_chars = 8000
self_check = "self-check-findings.md"
produces_contract = "quill.review.findings/v1"
accepts_contracts = ["quill.update.scope/v1", "quill.update.implementation/v1"]

[[workflows.pr_update.phase]]
id = "head_guard"
transitions = { DONE = "delivery_update_intent", PASS = "delivery_update_intent" }
type = "mechanical"
step = "pr_head_guard"
requires = ["review_update"]
produces_contract = "quill.pr-head/v1"
accepts_contracts = ["quill.review.findings/v1"]

[[workflows.pr_update.phase]]
id = "delivery_update_intent"
transitions = { DONE = "delivery_update", PASS = "delivery_update" }
type = "producer"
label = "prepare PR update text"
persona = "delivery-intent.md"
model = "Qwen3.6_35B_A3B_NVFP4"
skills = []
artifact = "delivery-update-intent.md"
inputs = ["update_scope", "update_impl"]
max_artifact_chars = 6000
requires = ["test", "build", "review_update", "head_guard"]
produces_contract = "quill.delivery-intent/v1"
accepts_contracts = ["quill.update.scope/v1", "quill.update.implementation/v1", "quill.verification/v1", "quill.review.findings/v1", "quill.pr-head/v1"]

[[workflows.pr_update.phase]]
id = "delivery_update"
transitions = { DONE = "ci", PASS = "ci" }
type = "mechanical"
label = "commit + push PR update"
step = "deliver_update"
requires = ["delivery_update_intent"]
produces_contract = "quill.delivery/v2"
accepts_contracts = ["quill.delivery-intent/v1"]

[[workflows.pr_update.phase]]
id = "ci"
transitions = { DONE = "acknowledge_feedback", PASS = "acknowledge_feedback", BLOCK = "update_impl", EXHAUSTED = "@fail" }
type = "mechanical"
label = "wait for PR tests"
step = "ci_check"
gates = true
retry_budget = 2
requires = ["delivery_update"]
produces_contract = "quill.ci/v1"
accepts_contracts = ["quill.delivery/v2"]

[[workflows.pr_update.phase]]
id = "acknowledge_feedback"
transitions = { DONE = "@complete", PASS = "@complete" }
type = "mechanical"
step = "acknowledge_pr_feedback"
requires = ["delivery_update", "ci"]
produces_contract = "quill.feedback-ack/v1"
accepts_contracts = ["quill.delivery/v2", "quill.ci/v1"]

[workflows.pr_review]
label = "Pull Request Review"
mode = "review"

[[workflows.pr_review.phase]]
id = "collect_pr_evidence"
transitions = { DONE = "review_pr", PASS = "review_pr" }
type = "mechanical"
label = "collect verification"
step = "collect_pr_evidence"
artifact = "pr-verification.md"
produces_contract = "quill.pr-evidence/v1"

[[workflows.pr_review.phase]]
id = "review_pr"
transitions = { DONE = "review_pr_final", PASS = "review_pr_final" }
type = "reviewer"
label = "review pull request"
against = ["collect_pr_evidence"]
structured_findings = true
max_artifact_chars = 12000
self_check = "self-check-findings.md"
produces_contract = "quill.review.findings/v1"
accepts_contracts = ["quill.pr-evidence/v1"]

[[workflows.pr_review.phase.audits]]
id = "requirements"
label = "requirements"
persona = "pr-review-requirements.md"
model = "Qwen3.6_27B_NVFP4"
skills = ["pull-request-review", "workbench", "technical-writing"]

[[workflows.pr_review.phase.audits]]
id = "correctness"
label = "correctness"
persona = "pr-review-correctness.md"
model = "Qwen3.6_27B_NVFP4"
skills = ["pull-request-review", "workbench", "technical-writing"]

[[workflows.pr_review.phase.audits]]
id = "architecture"
label = "architecture"
persona = "pr-review-architecture.md"
model = "Qwen3.6_27B_NVFP4"
skills = ["pull-request-review", "workbench", "technical-writing"]

[[workflows.pr_review.phase]]
id = "review_pr_final"
transitions = { DONE = "publish_pr_review", PASS = "publish_pr_review" }
type = "finalizer"
label = "review gate"
persona = "pr-review-final.md"
model = "Qwen3.6_27B_NVFP4"
skills = ["pull-request-review", "workbench", "technical-writing"]
artifact = "pr-review.json"
reconciles = ["review_pr"]
max_artifact_chars = 16000
self_check = "self-check-findings.md"
produces_contract = "quill.pr.review/v1"
accepts_contracts = ["quill.review.findings/v1"]

[[workflows.pr_review.phase]]
id = "publish_pr_review"
transitions = { DONE = "@complete", PASS = "@complete" }
type = "mechanical"
label = "publish review"
step = "publish_pr_review"
requires = ["review_pr_final"]
produces_contract = "quill.review-publication/v1"
accepts_contracts = ["quill.pr.review/v1"]
